[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stateful-session-replacement"
version = "0.0.1"
description = "Pure-Python, deterministic event simulation for Stateful AI Session Re-placement"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
